version: '3.8'

services:
  # PostgreSQL 16 with PostGIS
  postgres:
    image: kartoza/postgis:16-3.4
    platform: linux/arm64
    container_name: pingforce_postgres
    environment:
      POSTGRES_USER: ${DB_USER:-pingforce_user}
      POSTGRES_PASS: ${DB_PASSWORD:-pingforce_password}
      POSTGRES_DBNAME: ${DB_NAME:-pingforce_db}
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'pg_isready -U ${DB_USER:-pingforce_user} -d ${DB_NAME:-pingforce_db}',
        ]
      interval: 5s
      timeout: 5s
      retries: 5

  # Redis 7
  redis:
    image: redis:7-alpine
    container_name: pingforce_redis
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 5

  # MinIO (OCI Object Storage Emulator)
  minio:
    # MinIO stopped publishing public images (quay.io + Docker Hub now 401).
    # Chainguard's free build from MinIO source, pinned multi-arch digest —
    # must match deploy/docker-compose.yml (CI enforces it).
    image: cgr.dev/chainguard/minio@sha256:16b824a0016ffad3dfa8b059755f83800aa42ca68fe86f1782cabd0c5a16d322
    # Image defaults to uid 65532; root keeps volumes written by the old image readable.
    user: '0:0'
    container_name: pingforce_minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-admin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-admin123}
    ports:
      - '9000:9000'
      - '9001:9001'
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    healthcheck:
      # No curl in the Chainguard image; bash /dev/tcp checks the API port.
      test: ['CMD', 'bash', '-c', ':> /dev/tcp/127.0.0.1/9000']
      interval: 10s
      timeout: 5s
      retries: 3

  # MailHog (Email Testing)
  mailhog:
    image: mailhog/mailhog
    container_name: pingforce_mailhog
    ports:
      - '1025:1025' # SMTP server
      - '8025:8025' # Web UI

volumes:
  postgres_data:
  redis_data:
  minio_data:
