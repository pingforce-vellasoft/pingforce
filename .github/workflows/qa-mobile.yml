name: QA Android artifact
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
        working-directory: apps/mobile
      - run: flutter test
        working-directory: apps/mobile
      - run: flutter build apk --debug --dart-define=PINGFORCE_ENV=qa
        working-directory: apps/mobile
      - uses: actions/upload-artifact@v4
        with:
          name: PingForce-QA-APK
          path: apps/mobile/build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 7
