global:
  scrape_interval: 30s
  evaluation_interval: 30s

scrape_configs:
  # NestJS API metrics. The willsoto PrometheusModule controller is subject to
  # the global 'api' prefix and URI versioning set in main.ts, so the endpoint
  # is served at /api/v1/metrics — not the bare /metrics the module registers
  # in isolation. Scraping /metrics returns 404 and collects nothing.
  - job_name: pingforce-api
    metrics_path: /api/v1/metrics
    static_configs:
      - targets: ['api:3000']

  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']
