version: '3.8'

services:
  # The NestJS API Container
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: pingforce_api_prod
    restart: unless-stopped
    ports:
      - '3000:3000'
    environment:
      - NODE_ENV=production
      # Pass database URL from the VM's environment (e.g. from .env.production)
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - JWT_SECRET=${JWT_SECRET}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - pingforce_network

  # Production PostgreSQL Database
  postgres:
    image: postgis/postgis:16-3.4
    container_name: pingforce_postgres_prod
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-pingforce}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME:-pingforce_db}
    # Optional: Expose if you need external access (e.g. for a GUI tool), otherwise keep internal
    ports:
      - '5432:5432'
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'pg_isready -U ${DB_USER:-pingforce} -d ${DB_NAME:-pingforce_db}',
        ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - pingforce_network

  # Production Redis Cache
  redis:
    image: redis:7-alpine
    container_name: pingforce_redis_prod
    restart: unless-stopped
    # Use appendonly for durability in production
    command: redis-server --appendonly yes
    # Optional: Expose port, but usually best kept internal
    ports:
      - '6379:6379'
    volumes:
      - redis_prod_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - pingforce_network

volumes:
  postgres_prod_data:
  redis_prod_data:

networks:
  pingforce_network:
    driver: bridge
