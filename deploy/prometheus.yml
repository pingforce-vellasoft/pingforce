global:
  scrape_interval: 30s
  evaluation_interval: 30s

scrape_configs:
  # NestJS API metrics — willsoto PrometheusModule registers at /metrics,
  # bypassing the global 'api' prefix and URI versioning
  - job_name: pingforce-api
    metrics_path: /metrics
    static_configs:
      - targets: ['api:3000']

  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']
