version: '3.8'

services:
  # PostgreSQL 16 with PostGIS
  postgres:
    image: postgis/postgis:16-3.4
    container_name: pingforce_postgres
    environment:
      POSTGRES_USER: ${DB_USER:-pingforce_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-pingforce_password}
      POSTGRES_DB: ${DB_NAME:-pingforce_db}
    ports:
      - '5433:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'pg_isready -U ${DB_USER:-pingforce_user} -d ${DB_NAME:-pingforce_db}',
        ]
      interval: 5s
      timeout: 5s
      retries: 5

  # Redis 7
  redis:
    image: redis:7-alpine
    container_name: pingforce_redis
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 5

  # MinIO (OCI Object Storage Emulator)
  minio:
    image: minio/minio
    container_name: pingforce_minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-admin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-admin123}
    ports:
      - '9000:9000'
      - '9001:9001'
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:9000/minio/health/live']
      interval: 10s
      timeout: 5s
      retries: 3

  # MailHog (Email Testing)
  mailhog:
    image: mailhog/mailhog
    container_name: pingforce_mailhog
    ports:
      - '1025:1025' # SMTP server
      - '8025:8025' # Web UI

volumes:
  postgres_data:
  redis_data:
  minio_data:
