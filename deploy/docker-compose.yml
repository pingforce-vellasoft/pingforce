# PingForce production stack — lives at /opt/pingforce on the OCI VM.
#
# First-time setup on the server:
#   1. Copy this directory's contents to /opt/pingforce
#   2. cp .env.example .env  and fill in real values
#   3. Put the Firebase service-account JSON at /opt/pingforce/secrets/
#   4. Build the api image locally on the VM:  docker build -t pingforce_api:latest -f apps/api/Dockerfile .
#   5. docker compose up -d
#
# NOTE: api runs the locally-built pingforce_api:latest image — no ghcr pull.
# postgres reuses the external volume pingforce_postgres_prod_data (kartoza image).

name: pingforce

services:
  # ── Reverse proxy: TLS via Let's Encrypt, routes both API domains ────────
  caddy:
    image: caddy:2-alpine
    container_name: pingforce_caddy
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api

  # One-shot: generate the RS256 JWT keypair on the persistent jwt_keys volume
  # if it is not already there, then exit. Idempotent — an existing keypair is
  # left untouched, so this runs safely on every `up` and the keys survive image
  # pulls, container recreation, and `docker compose down`.
  #
  # Deleting the jwt_keys volume rotates the keys: every issued access/refresh
  # token becomes invalid and all users must log in again.
  jwt-keygen:
    image: alpine:3.20
    restart: 'no'
    volumes:
      - jwt_keys:/keys
    command:
      - sh
      - -c
      - |
        set -e
        if [ -s /keys/private.pem ] && [ -s /keys/public.pem ]; then
          echo "JWT keypair already present — leaving it untouched."
          exit 0
        fi
        echo "No JWT keypair found — generating a new RS256 pair."
        apk add --no-cache openssl >/dev/null
        openssl genrsa -out /keys/private.pem 2048
        openssl rsa -in /keys/private.pem -pubout -out /keys/public.pem
        # The api container runs as a non-root user and only ever reads these.
        chmod 444 /keys/public.pem
        chmod 444 /keys/private.pem
        echo "JWT keypair generated."

  api:
    # Image built + pushed by CI (package job) to GHCR. Pull, don't build on VM.
    image: ${API_IMAGE:-ghcr.io/pingforce-vellasoft/pingforce-api:latest}
    container_name: pingforce_api
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${DB_USER}:${DB_PASSWORD}@postgres:5432/${DB_NAME}?schema=public
      REDIS_URL: redis://redis:6379
      FIREBASE_SERVICE_ACCOUNT_PATH: /run/secrets/firebase-adminsdk.json
      # JwtConfigService reads <dir>/private.pem and <dir>/public.pem from here.
      JWT_KEYS_DIR: /app/keys
    volumes:
      - ./secrets/firebase-adminsdk.json:/run/secrets/firebase-adminsdk.json:ro
      - jwt_keys:/app/keys:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      # Must not boot before the keypair exists, or it crash-loops on startup.
      jwt-keygen:
        condition: service_completed_successfully
      # Never serve a pulled image against an un-migrated schema.
      migrate:
        condition: service_completed_successfully
    expose:
      - '3000'

  # One-shot: apply pending Prisma migrations, seed the catalog, then exit.
  # Uses the same GHCR image as api, so its schema always matches its code.
  # Runs automatically on every `up` and api waits for it to succeed — that is
  # what stops a pulled image from running against an older schema. Both steps
  # are idempotent: migrate deploy only applies migrations not yet recorded in
  # _prisma_migrations, and the seed is all upserts. Neither ever drops data.
  #
  # SEED_SUPER_ADMIN_PASSWORD is optional once an active super admin exists, and
  # leaving it unset is the norm after first deploy: when set, the seed RESETS
  # that account's password to its value on every deploy. It is required only
  # for the initial seed, which aborts without it rather than leave the
  # deployment with no way to log in.
  # The seed entrypoint is "tsx prisma/seed.ts", and tsx is a devDependency that
  # the production image does not ship — so pin+install it here rather than
  # letting `npx` silently reach out to the network mid-deploy.
  migrate:
    image: ${API_IMAGE:-ghcr.io/pingforce-vellasoft/pingforce-api:latest}
    restart: 'no'
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${DB_USER}:${DB_PASSWORD}@postgres:5432/${DB_NAME}?schema=public
    command:
      [
        'sh',
        '-c',
        'npx prisma migrate deploy && npx --yes tsx@4 prisma/seed.ts',
      ]
    depends_on:
      postgres:
        condition: service_healthy

  # ── Data stores ───────────────────────────────────────────────────────────
  # kartoza/postgis: matches the image the live data volume was initialised with.
  # Env vars use kartoza's names (POSTGRES_PASS / POSTGRES_DBNAME); ignored on an
  # already-initialised volume but kept correct in case of first init.
  postgres:
    image: kartoza/postgis:16-3.4
    container_name: pingforce_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASS: ${DB_PASSWORD}
      POSTGRES_DBNAME: ${DB_NAME}
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USER} -d ${DB_NAME}']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: pingforce_redis
    restart: unless-stopped
    command:
      [
        'redis-server',
        '--maxmemory',
        '256mb',
        '--maxmemory-policy',
        'allkeys-lru',
      ]
    volumes:
      - redis_data:/data

  minio:
    image: minio/minio:latest
    container_name: pingforce_minio
    restart: unless-stopped
    command: ['server', '/data', '--console-address', ':9001']
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
    volumes:
      - minio_data:/data
    expose:
      - '9000'
      - '9001'

  # ── Observability ─────────────────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:latest
    container_name: pingforce_prometheus
    restart: unless-stopped
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.retention.time=30d'
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prom_data:/prometheus
    expose:
      - '9090'

  grafana:
    image: grafana/grafana-oss:latest
    container_name: pingforce_grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD}
      GF_SERVER_ROOT_URL: https://grafana.pingforce.in
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    expose:
      - '3000'
    depends_on:
      - prometheus

volumes:
  caddy_data:
  caddy_config:
  # RS256 JWT keypair, generated once by jwt-keygen. Persists across image
  # pulls and container recreation — removing it forces every user to re-login.
  jwt_keys:
  # Reuse the EXISTING live data volume (created by the old root compose).
  # external: true => compose never creates/wipes it, only mounts it.
  postgres_prod_data:
    external: true
    name: pingforce_postgres_prod_data
  redis_data:
  minio_data:
  prom_data:
  grafana_data:
