<header class="nav">
  <div class="container nav-inner">
    <a class="brand" routerLink="/" (click)="closeMenu()"
      >Ping<span class="accent">Force</span></a
    >

    <button
      class="nav-toggle"
      type="button"
      [attr.aria-expanded]="menuOpen()"
      aria-label="Toggle menu"
      (click)="toggleMenu()"
    >
      <span></span><span></span><span></span>
    </button>

    <nav class="nav-links" [class.open]="menuOpen()">
      <a routerLink="/features" routerLinkActive="active" (click)="closeMenu()"
        >Features</a
      >
      <a routerLink="/pricing" routerLinkActive="active" (click)="closeMenu()"
        >Pricing</a
      >
      <a routerLink="/download" routerLinkActive="active" (click)="closeMenu()"
        >Download</a
      >
      <a class="btn btn-primary" routerLink="/pricing" (click)="closeMenu()"
        >Get started</a
      >
    </nav>
  </div>
</header>

<main>
  <router-outlet />
</main>

<footer class="footer">
  <div class="container footer-inner">
    <span>© {{ year }} PingForce · A Vellasoft product</span>
    <nav class="footer-links">
      <a routerLink="/features">Features</a>
      <a routerLink="/pricing">Pricing</a>
      <a routerLink="/download">Download</a>
      <a href="mailto:hello@pingforce.in">Contact</a>
    </nav>
  </div>
</footer>
